# PageX CI - one workflow, two jobs.
#
# OS-parity is the point: the GUI (PyQt6 platform plugins), the SQLite/FTS5
# store, PyMuPDF rendering and the frozen PyInstaller binaries all have
# Windows-specific failure modes. Every commit/PR is therefore proven on BOTH
# ubuntu-latest and windows-latest (x three Python versions) before a `v*` tag
# is allowed to produce release artifacts (`package` needs `test`).
#
# The test job deliberately installs only `.[dev]` - never the `llm` extra -
# so the matrix never needs a C++ compiler (llama-cpp-python builds from
# source; see pyproject.toml). Real-GGUF tests are deselected via -m "not
# slow"; the GUI tests run with QT_QPA_PLATFORM=offscreen (PyQt6 ships the
# offscreen plugin on Windows too).
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # test: 2 OS x 2 Python versions, every commit
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false          # one broken combo must not hide the others
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install package (no compiler needed - `llm` extra not installed)
        run: python -m pip install -e ".[dev]"

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Run test suite (headless Qt on both OSes)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q -m "not slow"

  # ---------------------------------------------------------------------------
  # package: build the release artifacts, but only for a pushed v* tag
  # ---------------------------------------------------------------------------
  package:
    name: package (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write           # softprops/action-gh-release creates/updates the release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11   # the interpreter the released binaries are built with
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install package + PyInstaller
        run: python -m pip install -e ".[dev]" pyinstaller

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      # The build scripts install the `llm` extra (llama-cpp-python) as well
      # and verify the dist/ outputs, so the frozen apps really ship inference.
      - name: Build Linux artifacts (onedir + tar.gz)
        if: runner.os == 'Linux'
        run: ./packaging/build_linux.sh
        shell: bash

      - name: Build Windows artifacts (onedir + installer)
        if: runner.os == 'Windows'
        run: ./packaging/build_windows.ps1
        shell: pwsh

      - name: Install Inno Setup 6
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Compile the installer (iscc)
        if: runner.os == 'Windows'
        run: iscc packaging\windows\pagex.iss
        shell: pwsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pagex-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.exe
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.exe
